[package]
name = "obd2"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["board-wayland"]
board-wayland = [
    "slint/backend-winit-wayland",
    "slint/renderer-software",
    "slint/compat-1-2",
]
board-kms = [
    "dep:input",
    "slint/backend-linuxkms-libinput",
    "slint/renderer-software",
    "slint/compat-1-2",
    "slint/unstable-libinput-09",
]

[dependencies]
slint = { version = "1.18.0", default-features = false }
signal-hook = "0.4.4"
input = { version = "0.10.0", optional = true }


[build-dependencies]
slint-build = "1.18.0"
lucide-slint = "1.46.0"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
i-slint-backend-linuxkms = { path = "crates/i-slint-backend-linuxkms-rga" }
