[package]
name = "obd2"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["board-wayland"]
board-wayland = [
    "slint/backend-winit-wayland",
    "slint/renderer-software",
    "slint/compat-1-2",
]
board-kms = [
    "dep:i-slint-backend-linuxkms",
    "dep:input",
    "slint/backend-linuxkms-noseat",
    "slint/renderer-software",
    "slint/compat-1-2",
]

[dependencies]
slint = { version = "1.17.1", default-features = false }
signal-hook = "0.3"
i-slint-backend-linuxkms = { version = "=1.17.1", optional = true, features = ["renderer-software"] }
input = { version = "0.10.0", optional = true }


[build-dependencies]
slint-build = "1.17.1"
lucide-slint = "1.41.0"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
