[package]
name = "obd2"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["board-wayland"]
board-wayland = [
    "slint/backend-winit-wayland",
    "slint/renderer-software",
    "slint/compat-1-2",
]
board-kms = [
    "dep:cobs",
    "dep:input",
    "dep:lyra-protocol",
    "dep:postcard",
    "dep:postcard-rpc",
    "dep:tokio",
    "dep:tokio-serial",
    "dep:tracing",
    "dep:tracing-subscriber",
    "slint/backend-linuxkms-libinput",
    "slint/renderer-software",
    "slint/compat-1-2",
    "slint/unstable-libinput-09",
]

[dependencies]
slint = { version = "1.18.0", default-features = false }
signal-hook = "0.4.4"
input = { version = "0.10.0", optional = true }
cobs = { version = "0.4", optional = true }
lyra-protocol = { path = "../v2/nrf-manager/crates/lyra-protocol", optional = true }
postcard = { version = "1", default-features = false, optional = true }
postcard-rpc = { git = "https://github.com/jamesmunns/postcard-rpc.git", rev = "2469ebc614108ac2ab68d923d50c8da4c9f3e91d", default-features = false, features = ["cobs"], optional = true }
tokio = { version = "1", features = ["io-util", "process", "rt", "time"], optional = true }
tokio-serial = { version = "5.5", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"], optional = true }


[build-dependencies]
slint-build = "1.18.0"
lucide-slint = "1.46.0"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
i-slint-backend-linuxkms = { path = "crates/i-slint-backend-linuxkms-rga" }
