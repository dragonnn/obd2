[package]
edition = "2024"
name = "nrf-manager"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[lib]
test = false
doctest = false

[[bin]]
name = "nrf-manager"
test = false

[[test]]
name = "nrf-test"
harness = false

[dev-dependencies]
embedded-can = "0.4"
embedded-test = { version = "0.7", features = ["embassy-010"] }

[dependencies]
lyra-protocol = { path = "crates/lyra-protocol" }
# The pinned upstream revision supports embedded-io 0.7 and Embassy executor 0.10.
postcard-rpc = { git = "https://github.com/jamesmunns/postcard-rpc.git", rev = "2469ebc614108ac2ab68d923d50c8da4c9f3e91d", default-features = false, features = ["embedded-io-async-0_7-server", "defmt"] }
# postcard-rpc's UART adapter still uses embassy-sync 0.7 internally.
embassy-sync-0-7 = { package = "embassy-sync", version = "0.7", default-features = false }
hsmc = { path = "./crates/hsmc/hsmc", features = ["embassy", "trace-defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt", "time"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "nightly",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "reset-pin-as-gpio",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"

fixed = "1.31.0"
static_cell = { version = "2.1.1" }
cortex-m = { version = "0.7.10", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rand = { version = "0.10.3", default-features = false }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
epdsi = { version = "0.10.3", default-features = false, features = ["defmt"] }
mcp251xfd = { path = "./crates/mcp251xfd-rs", features = ["async", "defmt"] }
num-integer = { version = "0.1.47", default-features = false }
ieee802154 = { version = "0.6.1", features = ["defmt"] }
byte = "0.2.7"
heapless = { version = "0.9.3", features = ["defmt"] }
statig = { version = "0.4.1", features = ["async"] }
embedded-alloc = "0.7.0"

[profile.release]
debug = 2
